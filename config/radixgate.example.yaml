# ==============================================================================
# RadixGate: Enterprise Prefix-Aware LLM Inference Router Configuration
# ==============================================================================

server:
  host: "0.0.0.0"
  port: 8080
  # PagedAttention block size in tokens (64 for vLLM, 1024 for Anthropic prompt caching)
  block_size: 64

balancer:
  # Routing algorithm: "prefix_aware" or "p2c_prefix" (Power-of-Two-Choices)
  policy: "prefix_aware"
  # Alpha: KV-cache prefix affinity reward [0.0 - 1.0]
  alpha: 0.75
  # Beta: In-flight worker concurrency penalty [0.0 - 1.0]
  beta: 0.25
  # P2C worker saturation threshold to trigger prefix migration
  saturation_threshold: 0.85

mesh:
  # Peer-to-peer UDP gossip mesh for multi-gateway cluster cache coherence
  enabled: false
  node_id: "gateway-node-01"
  bind_addr: "0.0.0.0:9090"
  peers:
    - "10.0.0.2:9090"
    - "10.0.0.3:9090"

# Inference worker replica fleet
workers:
  - id: "worker-prefill-01"
    endpoint_url: "http://10.0.1.1:8000"
    kv_capacity_blocks: 40000
    max_concurrency: 32
    role: "prefill" # Optimized for heavy prompt ingestion

  - id: "worker-decode-01"
    endpoint_url: "http://10.0.1.2:8000"
    kv_capacity_blocks: 20000
    max_concurrency: 64
    role: "decode" # Optimized for low-latency auto-regressive generation

  - id: "worker-unified-01"
    endpoint_url: "http://10.0.1.3:8000"
    kv_capacity_blocks: 30000
    max_concurrency: 48
    role: "unified"

# Optional model-specific routing constraints
models:
  - model: "claude-*"
    allowed_workers:
      - "worker-prefill-01"
      - "worker-decode-01"
