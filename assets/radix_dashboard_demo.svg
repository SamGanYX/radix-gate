<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" width="100%" height="100%">
  <style>
    .mono { font-family: "JetBrains Mono", "SF Mono", "Fira Code", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .term-bg { fill: #0d1117; }
    .frame-border { stroke: #30363d; stroke-width: 1; fill: none; }
    .box-border { stroke: #388bfd; stroke-width: 1; fill: #161b22; }
    .subbox-border { stroke: #30363d; stroke-width: 1; fill: #161b22; }
    .txt-primary { fill: #c9d1d9; font-size: 12px; }
    .txt-dim { fill: #8b949e; font-size: 11px; }
    .txt-green { fill: #3fb950; font-weight: bold; }
    .txt-cyan { fill: #58a6ff; font-weight: bold; }
    .txt-yellow { fill: #d29922; font-weight: bold; }
    .txt-purple { fill: #bc8cff; }
    .txt-white { fill: #f0f6fc; font-weight: bold; }
  </style>

  <!-- Terminal Window Background -->
  <rect width="920" height="510" rx="10" class="term-bg"/>
  <rect width="920" height="510" rx="10" class="frame-border"/>

  <!-- macOS Window Controls Header -->
  <path d="M 0 10 C 0 4.5 4.5 0 10 0 L 910 0 C 915.5 0 920 4.5 920 10 L 920 36 L 0 36 Z" fill="#161b22"/>
  <line x1="0" y1="36" x2="920" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="6" fill="#27c93f"/>
  <text x="460" y="22" text-anchor="middle" class="mono" font-size="12" fill="#8b949e">samgan@linux-workstation: ~/radix-gate — radix-gate top</text>

  <!-- Ratatui Root Frame Box -->
  <!-- Top Banner Area (y: 48, h: 36) -->
  <rect x="14" y="48" width="892" height="36" rx="5" class="box-border"/>
  <text x="28" y="70" class="mono txt-primary">
    <tspan class="txt-cyan">RADIX-GATE</tspan> :: Distributed KV-Cache Gateway &amp; Topology Inspector  [<tspan class="txt-yellow">http://127.0.0.1:8080</tspan>]  Status: <tspan class="txt-green">● CONNECTED</tspan>
  </text>

  <!-- Row of 4 Metric Boxes (y: 92, h: 68) -->
  <!-- KPI 1: Hit Ratio -->
  <rect x="14" y="92" width="216" height="68" rx="5" class="subbox-border"/>
  <text x="24" y="109" class="mono txt-dim">╭─ Global KV Hit Ratio ──╮</text>
  <text x="28" y="132" class="mono" font-size="12">
    <tspan fill="#3fb950">[███████████████████░] </tspan><tspan class="txt-green">98.6%</tspan>
  </text>
  <text x="28" y="148" class="mono txt-dim">Live Socket Load Test (4 workers)</text>

  <!-- KPI 2: Throughput -->
  <rect x="238" y="92" width="216" height="68" rx="5" class="subbox-border"/>
  <text x="248" y="109" class="mono txt-dim">╭─ Throughput ───────────╮</text>
  <text x="252" y="133" class="mono" font-size="15"><tspan class="txt-green">23,935.8</tspan> <tspan class="txt-primary" font-size="12">req/s</tspan></text>
  <text x="252" y="148" class="mono txt-dim">500 / 500 HTTP 2xx (0 errors)</text>

  <!-- KPI 3: Block Reused -->
  <rect x="462" y="92" width="216" height="68" rx="5" class="subbox-border"/>
  <text x="472" y="109" class="mono txt-dim">╭─ Block Cache Match ────╮</text>
  <text x="476" y="133" class="mono" font-size="14"><tspan class="txt-white">893</tspan> <tspan class="txt-dim">/ 906 blk</tspan></text>
  <text x="476" y="148" class="mono txt-dim">98.57% Prefix Blocks Reused</text>

  <!-- KPI 4: Topology Branches -->
  <rect x="686" y="92" width="220" height="68" rx="5" class="subbox-border"/>
  <text x="696" y="109" class="mono txt-dim">╭─ Radix Topology ───────╮</text>
  <text x="700" y="133" class="mono" font-size="14"><tspan class="txt-cyan">42</tspan> <tspan class="txt-primary">active branches</tspan></text>
  <text x="700" y="148" class="mono txt-dim">Max Depth: 8 · Block: 64 tok</text>

  <!-- Main Split Panels (y: 168, h: 300) -->
  <!-- Left Panel: Radix Tree Topology (w: 486, h: 300) -->
  <rect x="14" y="168" width="486" height="300" rx="5" class="subbox-border"/>
  <text x="24" y="186" class="mono txt-dim">╭─ Live Radix Tree Topology ──────────────────────────────────────╮</text>

  <g transform="translate(28, 206)" class="mono" font-size="11" fill="#c9d1d9">
    <text y="0">ROOT <tspan class="txt-dim">[block_size: 64 tokens | tiktoken cl100k_base]</tspan></text>
    <text y="18" fill="#8b949e">├── <tspan class="txt-purple">[0x8f2a1b9c..0x3e110a72]</tspan> (4 blk)</text>
    <text y="34" fill="#8b949e">│   ├── <tspan fill="#7ee787">[Cached: worker-01, worker-03]</tspan> <tspan class="txt-dim">(Hits: 412)</tspan></text>
    <text y="50" fill="#8b949e">│   ├── <tspan class="txt-purple">[0x09a4128f]</tspan> <tspan fill="#7ee787">[Cached: worker-01]</tspan> <tspan fill="#d29922">[InFlight: 1]</tspan> (Hits: 92)</text>
    <text y="66" fill="#8b949e">│   └── <tspan class="txt-purple">[0x7b5e4120..0x91d302a4]</tspan> (2 blk) <tspan fill="#7ee787">[Cached: worker-03]</tspan> (Hits: 38)</text>
    
    <text y="88" fill="#8b949e">├── <tspan class="txt-purple">[0x6098e6b8..0x7e99b7c7]</tspan> <tspan fill="#f778ba">[HOTSPOT VIRAL PREFIX]</tspan></text>
    <text y="104" fill="#8b949e">│   ├── <tspan fill="#58a6ff">[Replicated: worker-01 ➔ worker-02]</tspan> <tspan class="txt-dim">(Hits: 884)</tspan></text>
    <text y="120" fill="#8b949e">│   └── <tspan class="txt-purple">[0x2dafb93d]</tspan> <tspan class="txt-dim">[Optimistic In-Flight Lease: 90% hit-wt]</tspan></text>

    <text y="142" fill="#8b949e">└── <tspan class="txt-purple">[0xfa58bbe2..0x4d98d6d2]</tspan> (3 blk)</text>
    <text y="158" fill="#8b949e">    └── <tspan fill="#7ee787">[Cached: worker-04]</tspan> <tspan class="txt-dim">(Hits: 156, Idle: 42ms)</tspan></text>

    <text y="186" fill="#58a6ff">● Coalesced 14 thundering-herd concurrent prefills</text>
    <text y="202" fill="#3fb950">● Peer Mesh: 2 gateway nodes synchronized via UDP :9090 (&lt;0.8ms)</text>
    <text y="218" fill="#8b949e">● Discovery: Headless DNS (vllm-headless.default.svc:8000) OK</text>
    <text y="234" fill="#8b949e">● W3C Tracing: Context propagation active (traceparent)</text>
  </g>

  <!-- Right Panel: Inference Worker Fleet (w: 396, h: 300) -->
  <rect x="508" y="168" width="398" height="300" rx="5" class="subbox-border"/>
  <text x="518" y="186" class="mono txt-dim">╭─ Inference Worker Fleet (KV-Cache &amp; Load) ────────╮</text>

  <!-- Worker 1 -->
  <g transform="translate(522, 204)" class="mono">
    <text y="0" font-size="11">
      <tspan class="txt-green">● OK</tspan>  <tspan class="txt-white">worker-01</tspan>  <tspan fill="#58a6ff">[PREFILL]</tspan>
      <tspan class="txt-dim">  InFlight: </tspan><tspan fill="#f0f6fc">2/32 (6%)</tspan>
    </text>
    <text y="15" font-size="11">
      <tspan fill="#58a6ff">[████████████████░░░░░░░░] </tspan><tspan class="txt-dim">KV: 68.4% (27.3k blk)</tspan>
    </text>
  </g>

  <!-- Worker 2 -->
  <g transform="translate(522, 252)" class="mono">
    <text y="0" font-size="11">
      <tspan class="txt-green">● OK</tspan>  <tspan class="txt-white">worker-02</tspan>  <tspan fill="#a371f7">[DECODE]</tspan>
      <tspan class="txt-dim">   InFlight: </tspan><tspan fill="#f0f6fc">1/64 (2%)</tspan>
    </text>
    <text y="15" font-size="11">
      <tspan fill="#3fb950">[█████████████░░░░░░░░░░░] </tspan><tspan class="txt-dim">KV: 54.2% (10.8k blk)</tspan>
    </text>
  </g>

  <!-- Worker 3 -->
  <g transform="translate(522, 300)" class="mono">
    <text y="0" font-size="11">
      <tspan class="txt-green">● OK</tspan>  <tspan class="txt-white">worker-03</tspan>  <tspan fill="#8b949e">[UNIFIED]</tspan>
      <tspan class="txt-dim">  InFlight: </tspan><tspan fill="#d29922">3/48 (6%)</tspan>
    </text>
    <text y="15" font-size="11">
      <tspan fill="#d29922">[███████████████████░░░░░] </tspan><tspan class="txt-dim">KV: 82.1% (24.6k blk)</tspan>
    </text>
  </g>

  <!-- Worker 4 -->
  <g transform="translate(522, 348)" class="mono">
    <text y="0" font-size="11">
      <tspan class="txt-green">● OK</tspan>  <tspan class="txt-white">worker-04</tspan>  <tspan fill="#a371f7">[DECODE]</tspan>
      <tspan class="txt-dim">   InFlight: </tspan><tspan fill="#f0f6fc">0/64 (0%)</tspan>
    </text>
    <text y="15" font-size="11">
      <tspan fill="#3fb950">[██████████░░░░░░░░░░░░░░] </tspan><tspan class="txt-dim">KV: 41.0% (8.2k blk)</tspan>
    </text>
  </g>

  <!-- Disaggregated Note Box -->
  <g transform="translate(522, 396)">
    <rect width="370" height="52" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="18" class="mono" font-size="10" fill="#8b949e">Scheduling Policy: <tspan fill="#58a6ff">Prefill-Decode Disaggregation</tspan></text>
    <text x="10" y="32" class="mono" font-size="10" fill="#8b949e">Cold prompts (&lt;35% hits) ➔ Prefill (H100/compute-bound)</text>
    <text x="10" y="44" class="mono" font-size="10" fill="#8b949e">Warm prompts (≥70% hits) ➔ Decode (bandwidth-bound)</text>
  </g>

  <!-- Bottom Command Bar (y: 476, h: 26) -->
  <rect x="14" y="476" width="892" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="492" class="mono txt-dim">
    [<tspan class="txt-white">q</tspan>] Quit  |  [<tspan class="txt-white">r</tspan>] Force Refresh  |  RadixGate v0.1.0
  </text>
  <text x="896" y="492" text-anchor="end" class="mono txt-dim">
    P50: <tspan class="txt-green">0.64ms</tspan> · P95: <tspan class="txt-green">2.05ms</tspan> · P99: <tspan class="txt-yellow">7.03ms</tspan>
  </text>
</svg>