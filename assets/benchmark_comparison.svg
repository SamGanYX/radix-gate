<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    .bg { fill: #0d1117; }
    .border { stroke: #30363d; stroke-width: 1; fill: none; }
    .panel { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .grid { stroke: #21262d; stroke-width: 1; stroke-dasharray: 2,3; }
    .txt-title { font-size: 14px; font-weight: 600; fill: #f0f6fc; }
    .txt-sub { font-size: 11px; fill: #8b949e; }
    .txt-axis { font-size: 11px; fill: #c9d1d9; }
    .txt-metric { font-size: 12px; font-weight: 600; fill: #f0f6fc; }
    .bar-baseline { fill: #64748b; }
    .bar-second { fill: #475569; }
    .bar-radix { fill: #0284c7; }
    .annotation { font-size: 10px; font-weight: 600; fill: #38bdf8; }
  </style>

  <!-- Container -->
  <rect width="920" height="360" rx="8" class="bg"/>
  <rect width="920" height="360" rx="8" class="border"/>

  <!-- Chart Title Header -->
  <text x="24" y="32" class="font-sans txt-title">Empirical Cluster Inference Benchmark: Prefix-Aware vs Generic L7</text>
  <text x="24" y="48" class="font-sans txt-sub">Workload: 1,000 multi-turn requests (20 agent templates) across 4 workers with constrained KV capacity (150 blocks/worker)</text>

  <!-- Left Panel: Aggregate GPU Prefill Compute (Seconds) -->
  <g transform="translate(24, 70)">
    <rect width="424" height="264" rx="6" class="panel"/>
    <text x="16" y="24" class="font-sans" font-size="12" font-weight="600" fill="#f0f6fc">Aggregate GPU Prefill Compute Time</text>
    <text x="16" y="38" class="font-sans txt-sub">Cumulative seconds spent by GPUs recalculating prompt matrices (Lower is better)</text>

    <!-- Grid lines -->
    <line x1="16" y1="180" x2="394" y2="180" class="grid"/>

    <!-- Bar 1: Round-Robin -->
    <text x="16" y="76" class="font-mono txt-axis">Round-Robin (Generic L7)</text>
    <rect x="16" y="84" width="378" height="20" rx="2" fill="#21262d"/>
    <rect x="16" y="84" width="360" height="20" rx="2" class="bar-baseline"/>
    <text x="382" y="98" class="font-mono txt-metric" text-anchor="end">11.62 s</text>

    <!-- Bar 2: Least-Loaded -->
    <text x="16" y="132" class="font-mono txt-axis">Least-Loaded (Prefix-Blind)</text>
    <rect x="16" y="140" width="378" height="20" rx="2" fill="#21262d"/>
    <rect x="16" y="140" width="358" height="20" rx="2" class="bar-second"/>
    <text x="382" y="154" class="font-mono txt-metric" text-anchor="end">11.57 s</text>

    <!-- Bar 3: RadixGate -->
    <text x="16" y="188" class="font-mono txt-axis" fill="#38bdf8" font-weight="600">RadixGate (Prefix-Aware)</text>
    <rect x="16" y="196" width="378" height="20" rx="2" fill="#21262d"/>
    <rect x="16" y="196" width="176" height="20" rx="2" class="bar-radix"/>
    <text x="198" y="210" class="font-mono txt-metric" fill="#38bdf8">5.67 s</text>

    <!-- Bracket / Delta Annotation -->
    <line x1="180" y1="206" x2="354" y2="206" stroke="#38bdf8" stroke-width="1"/>
    <line x1="354" y1="201" x2="354" y2="211" stroke="#38bdf8" stroke-width="1"/>
    <text x="267" y="224" text-anchor="middle" class="font-mono annotation">▼ -51.6% GPU PREFILL TIME</text>

    <!-- Footer Stats -->
    <text x="16" y="248" class="font-mono txt-sub">Cache Hit Rate: <tspan fill="#64748b">69.3% (RR)</tspan> ➔ <tspan fill="#3fb950" font-weight="600">86.8% (RadixGate)</tspan></text>
  </g>

  <!-- Right Panel: Time-To-First-Token (TTFT) Latency (ms) -->
  <g transform="translate(472, 70)">
    <rect width="424" height="264" rx="6" class="panel"/>
    <text x="16" y="24" class="font-sans" font-size="12" font-weight="600" fill="#f0f6fc">Time-To-First-Token (TTFT) Latency Distribution</text>
    <text x="16" y="38" class="font-sans txt-sub">Average &amp; P95 response delay before first token emission (Lower is better)</text>

    <!-- Mean TTFT Comparison -->
    <text x="16" y="74" class="font-sans" font-size="11" font-weight="600" fill="#8b949e">MEAN TTFT</text>
    
    <text x="16" y="94" class="font-mono txt-axis">Round-Robin</text>
    <rect x="120" y="82" width="270" height="16" rx="2" fill="#21262d"/>
    <rect x="120" y="82" width="240" height="16" rx="2" class="bar-baseline"/>
    <text x="366" y="94" class="font-mono txt-metric" text-anchor="end">11.62 ms</text>

    <text x="16" y="122" class="font-mono txt-axis" fill="#38bdf8" font-weight="600">RadixGate</text>
    <rect x="120" y="110" width="270" height="16" rx="2" fill="#21262d"/>
    <rect x="120" y="110" width="117" height="16" rx="2" class="bar-radix"/>
    <text x="244" y="122" class="font-mono txt-metric" fill="#38bdf8">5.67 ms</text>
    <text x="366" y="122" class="font-mono annotation" text-anchor="end">2.05x FASTER</text>

    <line x1="16" y1="144" x2="408" y2="144" stroke="#21262d" stroke-width="1"/>

    <!-- P95 TTFT Comparison -->
    <text x="16" y="168" class="font-sans" font-size="11" font-weight="600" fill="#8b949e">TAIL LATENCY (P95 TTFT)</text>
    
    <text x="16" y="188" class="font-mono txt-axis">Round-Robin</text>
    <rect x="120" y="176" width="270" height="16" rx="2" fill="#21262d"/>
    <rect x="120" y="176" width="260" height="16" rx="2" class="bar-baseline"/>
    <text x="386" y="188" class="font-mono txt-metric" text-anchor="end">33.60 ms</text>

    <text x="16" y="216" class="font-mono txt-axis" fill="#38bdf8" font-weight="600">RadixGate</text>
    <rect x="120" y="204" width="270" height="16" rx="2" fill="#21262d"/>
    <rect x="120" y="204" width="156" height="16" rx="2" class="bar-radix"/>
    <text x="282" y="216" class="font-mono txt-metric" fill="#38bdf8">20.24 ms</text>
    <text x="386" y="216" class="font-mono annotation" text-anchor="end">1.66x FASTER</text>

    <!-- Footer Stats -->
    <text x="16" y="248" class="font-mono txt-sub">P99 TTFT: <tspan fill="#64748b">46.80 ms (RR)</tspan> ➔ <tspan fill="#3fb950" font-weight="600">34.80 ms (RadixGate)</tspan></text>
  </g>
</svg>