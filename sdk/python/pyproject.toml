[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radixgate"
version = "0.1.0"
description = "Official Python SDK and Inference Engine Sidecar for RadixGate - Prefix-Cache Aware Reverse Proxy"
readme = "README.md"
authors = [{ name = "RadixGate Authors", email = "maintainers@radixgate.ai" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "inference", "prefix-caching", "vllm", "sglang", "radix-tree"]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/SamGanYX/radix-gate"
Repository = "https://github.com/SamGanYX/radix-gate"
